<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Token Lab Snapshot</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg);
        --panel: var(--figma-color-bg-secondary);
        --line: var(--figma-color-border);
        --text: var(--figma-color-text);
        --muted: var(--figma-color-text-secondary);
        --brand: var(--figma-color-bg-brand);
        --brand-text: var(--figma-color-text-onbrand);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font: 12px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
      }

      main {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .panel {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
      }

      h2 {
        font-size: 14px;
      }

      .header {
        display: grid;
        gap: 10px;
      }

      .copy {
        color: var(--muted);
      }

      .toolbar,
      .summary-grid,
      .strategy-switch,
      .stat-grid,
      .collection-list,
      .conflict-list {
        display: grid;
        gap: 8px;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        background: transparent;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.is-active,
      .primary {
        border-color: transparent;
        color: var(--brand-text);
        background: var(--brand);
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-item,
      .stat-card,
      .collection-card,
      .conflict-card {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }

      .summary-item strong,
      .stat-card strong,
      .collection-head strong,
      .conflict-card strong {
        display: block;
        font-size: 14px;
      }

      .summary-item span,
      .stat-card span,
      .collection-card p,
      .conflict-card p,
      .conflict-card small {
        color: var(--muted);
      }

      .collection-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mini-list {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .status-note {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel header">
        <div>
          <p class="eyebrow">Token Lab / Figma Plugin</p>
          <h1>Live Variable Snapshot</h1>
        </div>
        <p class="copy">
          主线程会从当前文件真实读取 local variable collections，再把快照送进 planner 做导入预览。
        </p>
      </section>

      <section class="panel toolbar">
        <button id="refreshButton" type="button">Refresh Snapshot</button>
        <button id="importButton" class="primary" type="button">Import Skeleton</button>
      </section>

      <section class="panel">
        <p class="eyebrow">Current File</p>
        <div class="summary-grid">
          <div class="summary-item">
            <span>Editor</span>
            <strong id="editorType">loading</strong>
          </div>
          <div class="summary-item">
            <span>Current Page</span>
            <strong id="currentPage">Loading</strong>
          </div>
          <div class="summary-item">
            <span>Collections</span>
            <strong id="collectionCount">—</strong>
          </div>
          <div class="summary-item">
            <span>Variables</span>
            <strong id="variableCount">—</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <p class="eyebrow">Strategy</p>
        <div id="strategySwitch" class="strategy-switch"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Planner Stats</p>
        <div id="statGrid" class="stat-grid"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Snapshot Collections</p>
        <div id="collectionList" class="collection-list"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Conflicts</p>
        <div id="conflictList" class="conflict-list"></div>
      </section>

      <p id="statusNote" class="status-note"></p>
    </main>

    <script src="./import-planner.js"></script>
    <script src="./sample-document.js"></script>
    <script src="./ui.js"></script>
  </body>
</html>
