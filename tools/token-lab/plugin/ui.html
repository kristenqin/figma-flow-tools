<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Token Lab Snapshot</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg);
        --panel: var(--figma-color-bg-secondary);
        --line: var(--figma-color-border);
        --text: var(--figma-color-text);
        --muted: var(--figma-color-text-secondary);
        --brand: var(--figma-color-bg-brand);
        --brand-text: var(--figma-color-text-onbrand);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        font: 12px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
      }

      main {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .panel {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
      }

      h2 {
        font-size: 14px;
      }

      .header {
        display: grid;
        gap: 10px;
      }

      .copy {
        color: var(--muted);
      }

      .toolbar,
      .summary-grid,
      .strategy-switch,
      .stat-grid,
      .collection-list,
      .conflict-list {
        display: grid;
        gap: 8px;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        background: transparent;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.is-active,
      .primary {
        border-color: transparent;
        color: var(--brand-text);
        background: var(--brand);
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .summary-item,
      .stat-card,
      .collection-card,
      .conflict-card {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }

      .summary-item strong,
      .stat-card strong,
      .collection-head strong,
      .conflict-card strong {
        display: block;
        font-size: 14px;
      }

      .summary-item span,
      .stat-card span,
      .collection-card p,
      .conflict-card p,
      .conflict-card small {
        color: var(--muted);
      }

      .collection-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mini-list {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      .status-note {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel header">
        <div>
          <p class="eyebrow">Token Lab / Figma Plugin</p>
          <h1>Live Variable Snapshot</h1>
        </div>
        <p class="copy">
          主线程会从当前文件真实读取 local variable collections，再把快照送进 planner 做导入预览。
        </p>
      </section>

      <section class="panel toolbar">
        <button id="refreshButton" type="button">Refresh Snapshot</button>
        <button id="importButton" class="primary" type="button">Import Skeleton</button>
      </section>

      <section class="panel">
        <p class="eyebrow">Current File</p>
        <div class="summary-grid">
          <div class="summary-item">
            <span>Editor</span>
            <strong id="editorType">loading</strong>
          </div>
          <div class="summary-item">
            <span>Current Page</span>
            <strong id="currentPage">Loading</strong>
          </div>
          <div class="summary-item">
            <span>Collections</span>
            <strong id="collectionCount">—</strong>
          </div>
          <div class="summary-item">
            <span>Variables</span>
            <strong id="variableCount">—</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <p class="eyebrow">Strategy</p>
        <div id="strategySwitch" class="strategy-switch"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Planner Stats</p>
        <div id="statGrid" class="stat-grid"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Snapshot Collections</p>
        <div id="collectionList" class="collection-list"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Conflicts</p>
        <div id="conflictList" class="conflict-list"></div>
      </section>

      <section class="panel">
        <p class="eyebrow">Runtime Status</p>
        <p id="statusNote" class="status-note"></p>
      </section>
    </main>

    <script>
      (function bootstrapImportPlanner() {
        function flattenDocument(documentDraft) {
          var collectionMap = new Map();
          var tokenMap = new Map();
          var tokens = [];

          documentDraft.collections.forEach(function (collection) {
            collectionMap.set(collection.id, collection);

            collection.groups.forEach(function (group) {
              group.tokens.forEach(function (token) {
                var enriched = Object.assign({}, token, {
                  collectionId: collection.id,
                  collectionName: collection.name,
                  collectionDefaultMode: collection.defaultMode,
                  modeIds: collection.modes.map(function (mode) { return mode.id; }),
                  groupId: group.id,
                  groupName: group.name,
                  kind: group.kind
                });

                tokens.push(enriched);
                tokenMap.set(token.id, enriched);
              });
            });
          });

          return {
            collections: documentDraft.collections,
            collectionMap: collectionMap,
            tokenMap: tokenMap,
            tokens: tokens
          };
        }

        function validateTokenDocument(documentDraft) {
          var issues = [];
          var flat = flattenDocument(documentDraft);

          documentDraft.collections.forEach(function (collection) {
            var modeIds = new Set(collection.modes.map(function (mode) { return mode.id; }));
            var nameSet = new Set();

            if (!modeIds.has(collection.defaultMode)) {
              issues.push({
                level: "error",
                code: "default-mode",
                message: "Collection " + collection.name + " is missing default mode " + collection.defaultMode + "."
              });
            }

            collection.groups.forEach(function (group) {
              group.tokens.forEach(function (token) {
                var key = token.name + "::" + token.resolvedType;

                if (!token.name) {
                  issues.push({
                    level: "error",
                    code: "token-name",
                    message: "Token " + token.id + " is missing a name."
                  });
                }

                if (nameSet.has(key)) {
                  issues.push({
                    level: "error",
                    code: "duplicate-token-name",
                    message: "Duplicate token name " + token.name + " in collection " + collection.name + "."
                  });
                } else {
                  nameSet.add(key);
                }

                if (!token.valuesByMode || !token.valuesByMode[collection.defaultMode]) {
                  issues.push({
                    level: "error",
                    code: "default-value",
                    message: "Token " + token.name + " is missing a default mode value."
                  });
                }

                Object.keys(token.valuesByMode || {}).forEach(function (modeId) {
                  if (!modeIds.has(modeId)) {
                    issues.push({
                      level: "error",
                      code: "unknown-mode",
                      message: "Token " + token.name + " references unknown mode " + modeId + "."
                    });
                  }
                });

                if (token.aliasOf && !flat.tokenMap.has(token.aliasOf.tokenId)) {
                  issues.push({
                    level: "error",
                    code: "missing-alias-target",
                    message: "Token " + token.name + " references missing alias target " + token.aliasOf.tokenId + "."
                  });
                }
              });
            });
          });

          return issues;
        }

        function buildSnapshotIndex(snapshot) {
          var collectionNames = new Set();
          var variableIndex = new Map();

          snapshot.collections.forEach(function (collection) {
            collectionNames.add(collection.name);
            collection.variables.forEach(function (variable) {
              variableIndex.set(
                collection.name + "::" + normalizeFigmaVariableName(variable.name) + "::" + variable.resolvedType,
                Object.assign({ collectionName: collection.name }, variable)
              );
            });
          });

          return {
            collectionNames: collectionNames,
            variableIndex: variableIndex
          };
        }

        function buildRename(name, existingNames) {
          var candidate = name + ".copy";
          var index = 2;

          while (existingNames.has(candidate)) {
            candidate = name + ".copy" + index;
            index += 1;
          }

          return candidate;
        }

        function buildImportPlan(documentDraft, snapshot, strategy) {
          var validationIssues = validateTokenDocument(documentDraft);
          var flat = flattenDocument(documentDraft);
          var snapshotIndex = buildSnapshotIndex(snapshot);
          var knownNamesByCollection = new Map();
          var operations = [];
          var aliasOperations = [];
          var conflicts = [];

          flat.collections.forEach(function (collection) {
            knownNamesByCollection.set(
              collection.name,
              new Set(
                (((snapshot.collections.find(function (entry) { return entry.name === collection.name; }) || {}).variables) || []).map(
                  function (variable) { return variable.name; }
                )
              )
            );

            operations.push({
              kind: snapshotIndex.collectionNames.has(collection.name) ? "reuse-collection" : "create-collection",
              collectionName: collection.name
            });
          });

          flat.tokens.forEach(function (token) {
            var runtimeName = normalizeFigmaVariableName(token.name);
            var collisionKey = token.collectionName + "::" + runtimeName + "::" + token.resolvedType;
            var existingVariable = snapshotIndex.variableIndex.get(collisionKey);
            var collectionNames = knownNamesByCollection.get(token.collectionName) || new Set();

            if (existingVariable) {
              conflicts.push({
                tokenName: runtimeName,
                collection: token.collectionName,
                issue: "Name already exists in current file",
                suggestion:
                  strategy === "replace-values"
                    ? "Planner will reuse existing variable and update values."
                    : strategy === "rename-incoming"
                      ? "Planner will rename incoming token."
                      : "Planner will skip this token."
              });

              if (strategy === "replace-values") {
                operations.push({
                  kind: "update-token",
                  tokenId: token.id,
                  tokenName: runtimeName,
                  collectionName: token.collectionName
                });
                return;
              }

              if (strategy === "rename-incoming") {
                var renamed = buildRename(runtimeName, collectionNames);
                collectionNames.add(renamed);
                operations.push({
                  kind: "create-token",
                  tokenId: token.id,
                  tokenName: renamed,
                  originalName: token.name,
                  collectionName: token.collectionName
                });
                return;
              }

              operations.push({
                kind: "skip-token",
                tokenId: token.id,
                tokenName: token.name,
                collectionName: token.collectionName
              });
              return;
            }

            collectionNames.add(runtimeName);
            operations.push({
              kind: "create-token",
              tokenId: token.id,
              tokenName: runtimeName,
              collectionName: token.collectionName
            });
          });

          flat.tokens
            .filter(function (token) { return token.aliasOf; })
            .forEach(function (token) {
              var target = flat.tokenMap.get(token.aliasOf.tokenId);
              if (!target) {
                return;
              }

              aliasOperations.push({
                kind: "bind-alias",
                tokenName: token.name,
                targetName: target.name,
                collectionName: token.collectionName
              });
            });

          return {
            strategy: strategy,
            stats: {
              createCollections: operations.filter(function (operation) { return operation.kind === "create-collection"; }).length,
              reuseCollections: operations.filter(function (operation) { return operation.kind === "reuse-collection"; }).length,
              createTokens: operations.filter(function (operation) { return operation.kind === "create-token"; }).length,
              updateTokens: operations.filter(function (operation) { return operation.kind === "update-token"; }).length,
              skipTokens: operations.filter(function (operation) { return operation.kind === "skip-token"; }).length,
              aliasBindings: aliasOperations.length,
              validationErrors: validationIssues.filter(function (issue) { return issue.level === "error"; }).length,
              validationWarnings: validationIssues.filter(function (issue) { return issue.level === "warning"; }).length
            },
            operations: operations,
            aliasOperations: aliasOperations,
            conflicts: conflicts,
            validationIssues: validationIssues
          };
        }

        window.TokenLabImportPlanner = {
          flattenDocument: flattenDocument,
          validateTokenDocument: validateTokenDocument,
          buildImportPlan: buildImportPlan
        };

        function normalizeFigmaVariableName(name) {
          var segments = String(name || "")
            .split(/[./]+/)
            .map(function (segment) { return segment.trim(); })
            .filter(Boolean);

          return segments.join("/") || "";
        }
      }());
    </script>

    <script>
      (function bootUI() {
        var planner = window.TokenLabImportPlanner;
        var sampleDocument = JSON.parse(JSON.stringify(window.TOKEN_LAB_PLUGIN_SAMPLE_DOCUMENT));

        var state = {
          strategy: "skip-existing",
          snapshot: null,
          error: null,
          lastResult: null,
          lastAck: null
        };

        var elements = {
          editorType: document.querySelector("#editorType"),
          currentPage: document.querySelector("#currentPage"),
          collectionCount: document.querySelector("#collectionCount"),
          variableCount: document.querySelector("#variableCount"),
          strategySwitch: document.querySelector("#strategySwitch"),
          statGrid: document.querySelector("#statGrid"),
          collectionList: document.querySelector("#collectionList"),
          conflictList: document.querySelector("#conflictList"),
          refreshButton: document.querySelector("#refreshButton"),
          importButton: document.querySelector("#importButton"),
          statusNote: document.querySelector("#statusNote")
        };

        window.onmessage = function (event) {
          var message = event.data.pluginMessage;
          if (!message) {
            return;
          }

          if (message.type === "token-lab/snapshot") {
            state.snapshot = message.payload;
            state.error = null;
            render();
            return;
          }

          if (message.type === "token-lab/ack") {
            state.lastAck = message.payload.action;
            state.error = null;
            render();
            return;
          }

          if (message.type === "token-lab/import-result") {
            state.lastResult = message.payload.result;
            state.snapshot = message.payload.snapshot;
            state.error = null;
            render();
            return;
          }

          if (message.type === "token-lab/error") {
            state.error = message.payload.message;
            render();
          }
        };

        elements.refreshButton.addEventListener("click", function () {
          state.lastAck = "refresh-requested-from-ui";
          state.error = null;
          render();
          parent.postMessage({ pluginMessage: { type: "token-lab/refresh-snapshot" } }, "*");
        });

        elements.importButton.addEventListener("click", function () {
          state.lastAck = "import-requested-from-ui";
          state.error = null;
          render();
          parent.postMessage({
            pluginMessage: {
              type: "token-lab/request-import",
              payload: {
                document: sampleDocument,
                strategy: state.strategy
              }
            }
          }, "*");
        });

        function init() {
          renderStrategySwitch();
          render();
          parent.postMessage({ pluginMessage: { type: "token-lab/plugin-ready" } }, "*");
        }

        function render() {
          var snapshot = state.snapshot;
          var plan = snapshot ? planner.buildImportPlan(sampleDocument, normalizeSnapshot(snapshot), state.strategy) : null;

          elements.editorType.textContent = snapshot ? snapshot.editorType : "loading";
          elements.currentPage.textContent = snapshot ? snapshot.pageName : "Loading current page";
          elements.collectionCount.textContent = snapshot ? String(snapshot.collectionCount) : "—";
          elements.variableCount.textContent = snapshot ? String(countVariables(snapshot.collections)) : "—";
          elements.statusNote.textContent = state.error
            ? state.error
            : state.lastResult
              ? "Last import: " + state.lastResult.stats.created + " created, " + state.lastResult.stats.updated + " updated, " + state.lastResult.stats.aliases + " alias bindings."
              : state.lastAck
                ? "Runtime event: " + state.lastAck
              : snapshot
                ? "Current file snapshot loaded from figma.variables."
                : "Waiting for plugin main thread to return the current variable snapshot.";

          renderStatGrid(plan);
          renderCollectionList(snapshot);
          renderConflictList(plan);
        }

        function renderStrategySwitch() {
          var strategies = [
            ["skip-existing", "Skip Existing"],
            ["rename-incoming", "Rename Incoming"],
            ["replace-values", "Replace Values"]
          ];

          elements.strategySwitch.innerHTML = "";
          strategies.forEach(function (pair) {
            var id = pair[0];
            var label = pair[1];
            var button = document.createElement("button");
            button.type = "button";
            button.className = state.strategy === id ? "is-active" : "";
            button.textContent = label;
            button.addEventListener("click", function () {
              state.strategy = id;
              renderStrategySwitch();
              render();
            });
            elements.strategySwitch.append(button);
          });
        }

        function renderStatGrid(plan) {
          elements.statGrid.innerHTML = "";

          if (!plan) {
            return;
          }

          [
            ["Create Collections", plan.stats.createCollections],
            ["Reuse Collections", plan.stats.reuseCollections],
            ["Create Tokens", plan.stats.createTokens],
            ["Update Tokens", plan.stats.updateTokens],
            ["Skip Tokens", plan.stats.skipTokens],
            ["Alias Bindings", plan.stats.aliasBindings]
          ].forEach(function (entry) {
            var card = document.createElement("article");
            card.className = "stat-card";
            card.innerHTML = "<span>" + entry[0] + "</span><strong>" + entry[1] + "</strong>";
            elements.statGrid.append(card);
          });
        }

        function renderCollectionList(snapshot) {
          elements.collectionList.innerHTML = "";

          if (!snapshot) {
            return;
          }

          snapshot.collections.forEach(function (collection) {
            var card = document.createElement("article");
            card.className = "collection-card";
            card.innerHTML =
              "<div class=\"collection-head\"><strong>" + collection.name + "</strong><span>" + collection.variables.length + " vars</span></div>" +
              "<p>Modes: " + collection.modes.map(function (mode) { return mode.name; }).join(", ") + "</p>" +
              "<ul class=\"mini-list\">" +
              collection.variables.slice(0, 4).map(function (variable) {
                return "<li>" + variable.name + " · " + variable.resolvedType + "</li>";
              }).join("") +
              "</ul>";
            elements.collectionList.append(card);
          });
        }

        function renderConflictList(plan) {
          var messages;

          elements.conflictList.innerHTML = "";

          if (!plan) {
            return;
          }

          messages = []
            .concat(plan.conflicts)
            .concat(
              plan.validationIssues.map(function (issue) {
                return {
                  tokenName: issue.code,
                  collection: "Validation",
                  issue: issue.message,
                  suggestion: issue.level === "error" ? "Resolve before import." : "Review before import."
                };
              })
            );

          if (!messages.length) {
            elements.conflictList.innerHTML =
              "<article class=\"conflict-card\">" +
              "<strong>No blockers</strong>" +
              "<p>Sample draft can be planned against the current file without validation errors.</p>" +
              "<span>Planner</span>" +
              "<small>Main thread import executor is available for create / update / alias runs.</small>" +
              "</article>";
          } else {
            messages.forEach(function (conflict) {
              var card = document.createElement("article");
              card.className = "conflict-card";
              card.innerHTML =
                "<strong>" + conflict.tokenName + "</strong>" +
                "<p>" + conflict.issue + "</p>" +
                "<span>" + conflict.collection + "</span>" +
                "<small>" + conflict.suggestion + "</small>";
              elements.conflictList.append(card);
            });
          }

          if (state.lastResult && state.lastResult.logs && state.lastResult.logs.length) {
            state.lastResult.logs.slice(-6).forEach(function (log) {
              var card = document.createElement("article");
              card.className = "conflict-card";
              card.innerHTML =
                "<strong>" + log.level.toUpperCase() + "</strong>" +
                "<p>" + log.message + "</p>" +
                "<span>Import Log</span>" +
                "<small>Runtime executor output</small>";
              elements.conflictList.append(card);
            });
          }
        }

        function countVariables(collections) {
          return collections.reduce(function (count, collection) {
            return count + collection.variables.length;
          }, 0);
        }

        function normalizeSnapshot(snapshot) {
          return {
            collections: snapshot.collections.map(function (collection) {
              return {
                name: collection.name,
                modes: collection.modes.map(function (mode) { return mode.name; }),
                variables: collection.variables.map(function (variable) {
                  return {
                    name: variable.name,
                    resolvedType: variable.resolvedType,
                    modes: collection.modes.map(function (mode) { return mode.name; }),
                    isAlias: variable.isAlias
                  };
                })
              };
            })
          };
        }

        init();
      }());
    </script>
  </body>
</html>
